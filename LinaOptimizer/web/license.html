<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinaOptimizer - Licença</title>
  <style>
    :root {
      color-scheme: dark;
      --primary: #00f3ff;
      --secondary: #bc13fe;
      --bg: #050507;
      --card: rgba(15, 17, 21, 0.92);
      --text: #f5f5f5;
      --muted: #c7c7c7;
      --danger: #ff6b6b;
      --success: #6dff7a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Rajdhani', system-ui, sans-serif;
      background: radial-gradient(circle at top, rgba(0, 243, 255, 0.15), transparent 55%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(460px, 92vw);
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { margin: 0 0 18px; color: var(--muted); }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0b0b0b;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 14px;
    }
    button {
      width: 100%;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: 1px solid var(--primary);
      color: var(--primary);
      background: transparent;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <h1>LinaOptimizer</h1>
    <p>Insira sua licença para liberar o acesso ao painel.</p>
    <input id="licenseKey" type="text" placeholder="Chave de licença" />
    <button id="licenseSubmit">Validar</button>
    <div id="licenseStatus" class="status"></div>
  </div>
  <script src="/license.js"></script>
</body>
</html>
